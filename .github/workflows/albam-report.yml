name: Albam Report to Telegram

# 맥의 예약 작업이 outbox/albam/*.txt 를 push하면 그 파일 내용을 기본 봇으로 보낸다.
on:
  push:
    branches: [main]
    paths: ["outbox/albam/*.txt"]
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'outbox/albam/*.txt')
          else
            FILES=$(ls -t outbox/albam/*.txt | head -1)
          fi
          echo "$FILES"
          cd pipeline
          for f in $FILES; do
            python - "../$f" <<'PY'
          import sys, time
          from send_telegram import send_text
          text = open(sys.argv[1], encoding="utf-8").read().strip()
          # 텔레그램 4096자 제한: 빈 줄 기준으로 나눠 여러 통으로 보낸다
          chunks, cur = [], ""
          for para in text.split("\n\n"):
              while len(para) > 3900:
                  if cur:
                      chunks.append(cur); cur = ""
                  chunks.append(para[:3900]); para = para[3900:]
              if len(cur) + len(para) + 2 > 3900:
                  chunks.append(cur); cur = para
              else:
                  cur = f"{cur}\n\n{para}" if cur else para
          if cur:
              chunks.append(cur)
          for c in chunks:
              send_text(c)
              time.sleep(1)
          print(f"sent {len(chunks)} message(s) from {sys.argv[1]}")
          PY
          done
