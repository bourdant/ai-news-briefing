name: Telegram One-off (report link)

on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: pipeline
        run: |
          python - <<'PY'
          from send_telegram import send_text
          text = (
              "🎬 롱폼 주제 리포트 수정본 (10/14)\n\n"
              "염색·매직은 미용사 영역이라 뺐고, 뷰티까지 넓혔어요.\n"
              "유튜브에서 올해 영상을 조회수순으로 직접 찾아봤어요.\n\n"
              "잘되는 틀 두 가지: 돈 아끼기(사기템, 1등 vs 꼴등) / 귀찮음 줄이기(대충해도 10분)\n\n"
              "추천 순서\n"
              "① 내돈내산 머릿결 사기템 vs 재구매템\n"
              "② 귀찮은 사람용 최소 루틴 (댓글 약속)\n"
              "③ 다이소 vs 올리브영 같은 제형 비교\n"
              "④ 헤어오일 총정리 ⑤ 얼굴형별 가르마·볼륨\n"
              "⑥ 10분 출근 메이크업 ⑦ 셀프 볼륨 지속력 테스트\n\n"
              "아래 버튼을 누르면 claude.ai에서 열려요. 같은 링크라 아까 리포트가 새 내용으로 바뀌었어요."
          )
          send_text(text, "리포트 열기",
                    "https://claude.ai/artifact/KwwuiUHESAquu9CvjRYJSy")
          print("sent")
          PY
