name: Telegram One-off (report link)

on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: pipeline
        run: |
          python - <<'PY'
          from send_telegram import send_text
          text = (
              "🎬 다음 주 롱폼 주제 리포트 (10/14)\n\n"
              "유튜브 스튜디오 영상 28개, 머릿결 영상 댓글 전부, 유튜브 검색 데이터를 봤어요.\n\n"
              "추천 순서\n"
              "① 반곱슬 볼륨매직 총정리 (검색량 1위, '매직 후 머리 감기' 상승 중)\n"
              "② 귀찮은 사람용 최소 루틴 (댓글 요청 + 답글로 약속한 영상)\n"
              "③ 헤어오일 총정리 (댓글 질문 최다, 일본 오일 검색 급상승)\n"
              "그 밖에 ④ 지성 두피+손상모 ⑤ 염색모 관리 ⑥ 반곱슬 살리기\n\n"
              "아래 버튼을 누르면 claude.ai에서 열려요. 로그인이 필요해요."
          )
          send_text(text, "리포트 열기",
                    "https://claude.ai/artifact/KwwuiUHESAquu9CvjRYJSy")
          print("sent")
          PY
