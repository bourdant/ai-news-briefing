name: Telegram One-off (report link)

on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: pipeline
        run: |
          python - <<'PY'
          from send_telegram import send_text
          text = (
              "📑 롱폼 주제 시장 리포트 (10/12)\n\n"
              "클래스101·탈잉·크몽·와디즈를 더 깊게 보고, 5개 분야 25개 주제를 분석했어요.\n\n"
              "- 분야마다: 고객이 막히는 지점, 구매자 성격, 돈 버는 구조, 무명 1인 진입, 롱폼 예시\n"
              "- 마지막에 \"롱폼 적합도 × 무명 진입\" 그림으로 정리했어요.\n\n"
              "한 줄 결론: 롱폼에 맞고 무명도 들어갈 수 있는 곳은 사연형, 운세 풀이, 당사자 기록형이에요.\n\n"
              "아래 버튼을 누르면 claude.ai에서 열려요. 로그인이 필요해요."
          )
          send_text(text, "리포트 열기",
                    "https://claude.ai/code/artifact/f56ba90a-e51d-40c1-a2cb-6699a467ed37")
          print("sent")
          PY
