name: Daily AI News Briefing

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 14:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Run daily briefing pipeline
        working-directory: .
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_NEWS_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PAGE_BASE_URL: ${{ vars.PAGE_BASE_URL }}
          CF_WORKER_URL: ${{ vars.CF_WORKER_URL }}
        run: python pipeline/run_daily.py

      - name: Commit and push updated pages
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "chore: daily AI news briefing $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
