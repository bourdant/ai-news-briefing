name: Daily AI News Briefing

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 14:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily briefing pipeline
        working-directory: .
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PAGE_BASE_URL: ${{ vars.PAGE_BASE_URL }}
          CF_WORKER_URL: ${{ vars.CF_WORKER_URL }}
        run: python pipeline/run_daily.py

      - name: Commit and push updated pages
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "chore: daily AI news briefing $(date -u +%Y-%m-%d)"
            git push
          fi
